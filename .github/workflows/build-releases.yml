name: Build Releases

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-linux:
    name: Build for Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      run: |
        chmod +x build-tools/build-linux.sh
        cd build-tools
        ./build-linux.sh
        
    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: LabelCraft-linux
        path: dist/linux_LabelCraft_*.tar.gz
        if-no-files-found: error
        
    - name: Create GitHub Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/linux_LabelCraft_*.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      shell: bash
      run: |
        # Create Windows-specific build script
        cat > build-windows-native.sh << 'EOF'
        #!/bin/bash
        set -e
        
        echo "========================================="
        echo "Building LabelCraft for Windows"
        echo "========================================="
        
        # Get version
        VERSION=$(python -c "from libs import __version__; print(__version__)" 2>/dev/null || echo "latest")
        
        # Clean previous builds
        rm -rf build dist LabelCraft.spec
        
        # Build with PyInstaller
        pyinstaller --name=LabelCraft \
            --onefile \
            --windowed \
            --add-data="resources;resources" \
            --add-data="data;data" \
            --add-data="libs;libs" \
            --hidden-import=PySide6 \
            --hidden-import=PySide6.QtCore \
            --hidden-import=PySide6.QtGui \
            --hidden-import=PySide6.QtWidgets \
            --hidden-import=lxml \
            --hidden-import=lxml.etree \
            main.py
            
        # Create distribution package
        DIST_DIR="dist/windows_LabelCraft_${VERSION}"
        mkdir -p "$DIST_DIR"
        cp dist/LabelCraft.exe "$DIST_DIR/"
        cp -r data "$DIST_DIR/" 2>/dev/null || true
        cp README.md "$DIST_DIR/" 2>/dev/null || true
        
        # Create zip archive
        cd dist
        7z a "windows_LabelCraft_${VERSION}.zip" "windows_LabelCraft_${VERSION}/"
        cd ..
        
        echo "Build completed: dist/windows_LabelCraft_${VERSION}.zip"
        EOF
        
        chmod +x build-windows-native.sh
        ./build-windows-native.sh
        
    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: LabelCraft-windows
        path: dist/windows_LabelCraft_*.zip
        if-no-files-found: error
        
    - name: Create GitHub Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: dist/windows_LabelCraft_*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build for macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: Build executable
      run: |
        chmod +x build-tools/build-macos.sh
        cd build-tools
        ./build-macos.sh
        
    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: LabelCraft-macos
        path: |
          dist/macOS_LabelCraft_*.zip
          dist/macOS_LabelCraft_*.dmg
        if-no-files-found: warn
        
    - name: Create GitHub Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/macOS_LabelCraft_*.zip
          dist/macOS_LabelCraft_*.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-pypi:
    name: Build for PyPI
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build packages
      run: python -m build
      
    - name: Check packages
      run: twine check dist/*
      
    - name: Upload to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
