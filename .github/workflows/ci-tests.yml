name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Verify imports
      run: |
        python -c "import PySide6; print(f'PySide6 version: {PySide6.__version__}')"
        python -c "import lxml; print(f'lxml version: {lxml.__version__}')"
        
    - name: Check resources
      run: |
        python -c "from libs.resources import *; print('Resources loaded successfully')"
        
    - name: Validate annotation converter
      run: |
        python -c "from libs.annotation_converter import AnnotationConverter; print('AnnotationConverter imported successfully')"
        
    - name: Test basic functionality
      run: |
        python -c "
        import sys
        sys.path.insert(0, '.')
        from libs.labelFile import LabelFileFormat
        print(f'LabelFileFormat supported: {list(LabelFileFormat)}')
        print('Basic tests passed!')
        "
